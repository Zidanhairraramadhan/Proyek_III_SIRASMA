  <!-- Typography -->
  <text x="145" y="74" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="1">ULBI</text>
  <text x="147" y="102" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="14.5" fill="#FF9D54" letter-spacing="0.5">UNIVERSITAS LOGISTIK &amp; BISNIS INTERNASIONAL</text>
</svg>

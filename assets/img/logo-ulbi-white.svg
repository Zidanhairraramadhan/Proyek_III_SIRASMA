<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <defs>
    <linearGradient id="ulbiGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D54"/>
      <stop offset="100%" stop-color="#F37021"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Hexagonal Rings -->
  <g transform="translate(65, 65) scale(0.95)">
    <path d="M 0,-40 L 16,-30 L 16,-12 L 0,-2 L -16,-12 L -16,-30 Z" fill="url(#ulbiGradLight)"/>

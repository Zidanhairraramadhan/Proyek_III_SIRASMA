    <path d="M 0,40 L 16,50 L 16,68 L 0,78 L -16,68 L -16,50 Z" transform="rotate(120) translate(-8,-8)" fill="url(#ulbiGradLight)"/>
    <path d="M -34,20 L -18,30 L -18,48 L -34,58 L -50,48 L -50,30 Z" transform="rotate(180) translate(-8,-8)" fill="url(#ulbiGradLight)"/>
